plugins {
    alias(libs.plugins.android.application)
}

// Keys live in local.properties (gitignored), never in source.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.example.edmanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.edmanager"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [mapsApiKey: localProps.getProperty('MAPS_API_KEY', '')]
        buildConfigField "String", "DROPBOX_REFRESH_TOKEN", "\"${localProps.getProperty('DROPBOX_REFRESH_TOKEN', '')}\""
        buildConfigField "String", "DROPBOX_APP_KEY", "\"${localProps.getProperty('DROPBOX_APP_KEY', '')}\""
        buildConfigField "String", "DROPBOX_APP_SECRET", "\"${localProps.getProperty('DROPBOX_APP_SECRET', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            java {
                srcDirs 'src\\main\\java', 'src\\main\\java\\com.example.edmanager\\activity'
            }
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    implementation 'com.dropbox.core:dropbox-core-sdk:5.4.0'
}